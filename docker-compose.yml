services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yego}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-yego}
    volumes:
      - yego_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yego} -d ${POSTGRES_DB:-yego}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Exposé sur l'hôte en 5434 (évite un conflit avec un Postgres local en 5432).
    # Accès depuis l'hôte : postgresql://yego:...@localhost:5434/yego
    # Lié à 127.0.0.1 : joignable depuis cette machine (tests, Prisma Studio),
    # pas depuis le reste du réseau local.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # production par défaut ; un .env de dev peut passer development pour
      # autoriser PAYMENT_SIMULATION / SEED_ON_START (refusés en production).
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Communication inter-conteneurs : Postgres écoute toujours sur 5432 côté réseau Docker.
      # API_DATABASE_URL (optionnel) : base hébergée (ex. Neon, connexion
      # directe « unpooled » : les migrations Prisma s'y appliquent au
      # démarrage). Vide = la base Postgres de ce compose.
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://${POSTGRES_USER:-yego}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yego}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET requis}
      # Simulation de paiement (POST /paiements/reservation/:id/simuler).
      # Laisser 'false' hors dev / tests d'intégration.
      PAYMENT_SIMULATION: ${PAYMENT_SIMULATION:-false}
      # Clé Ed25519 (PEM) qui signe les QR pour la validation hors-ligne.
      # Vide = clé éphémère par démarrage (dev).
      TICKET_SIGNING_PRIVATE_KEY: ${TICKET_SIGNING_PRIVATE_KEY:-}
      # Vide = aucun site web autorisé (les apps mobiles ne sont pas concernées).
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SEED_ON_START: ${SEED_ON_START:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      # Jèko (paiement en ligne, remboursements, reversements). Vide = non branché.
      JEKO_API_KEY: ${JEKO_API_KEY:-}
      JEKO_API_KEY_ID: ${JEKO_API_KEY_ID:-}
      JEKO_STORE_ID: ${JEKO_STORE_ID:-}
      JEKO_WEBHOOK_SECRET: ${JEKO_WEBHOOK_SECRET:-}
      JEKO_SUCCESS_URL: ${JEKO_SUCCESS_URL:-}
      JEKO_ERROR_URL: ${JEKO_ERROR_URL:-}
      APP_DEEP_LINK_PAIEMENT: ${APP_DEEP_LINK_PAIEMENT:-yego://paiement}
      REVERSEMENT_COMMISSION_POURCENT: ${REVERSEMENT_COMMISSION_POURCENT:-0}
      FRAIS_SERVICE_POURCENT: ${FRAIS_SERVICE_POURCENT:-5}
      # Documents de compagnie (registre de commerce…) : stockés sur ce volume,
      # pas en base. Survit aux redéploiements ; à sauvegarder comme yego_pgdata.
      UPLOADS_DIR: /app/uploads
    volumes:
      - yego_uploads:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  yego_pgdata:
  yego_uploads:
