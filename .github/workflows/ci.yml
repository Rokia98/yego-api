name: CI - Yègo API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yego
          POSTGRES_PASSWORD: yego
          POSTGRES_DB: yego_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yego:yego@localhost:5432/yego_test
      JWT_SECRET: ci-secret-au-moins-trente-deux-caracteres-1234
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-1234

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Tests e2e (HTTP)
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t yego-api:ci .
